<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<style>
  @font-face{font-family:"Onest";src:url("../assets/fonts/onest-cyrillic.woff2") format("woff2");
    font-weight:100 900;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  @font-face{font-family:"Onest";src:url("../assets/fonts/onest-latin.woff2") format("woff2");
    font-weight:100 900;unicode-range:U+0000-00FF}
  @font-face{font-family:"JetBrains Mono";src:url("../assets/fonts/jetbrains-mono-cyrillic.woff2")
    format("woff2");font-weight:100 800;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
  *{margin:0;box-sizing:border-box}
  body{width:1200px;height:630px;background:#FBF7F4;font-family:"Onest",sans-serif;
    padding:76px 84px;display:flex;flex-direction:column;justify-content:space-between;
    background-image:radial-gradient(120% 90% at 78% 8%,#F3EAE3,#FBF7F4 62%)}
  .brand{font-size:30px;font-weight:900;letter-spacing:-.02em;color:#1B1216}
  .brand i{color:#C6304B;font-style:normal}
  h1{font-size:82px;line-height:1.02;letter-spacing:-.035em;font-weight:900;color:#1B1216;
    max-width:15ch}
  h1 b{background:linear-gradient(135deg,#C6304B,#7E2434);-webkit-background-clip:text;
    background-clip:text;-webkit-text-fill-color:transparent}
  .foot{display:flex;justify-content:space-between;align-items:flex-end}
  .foot p{font-size:24px;color:#6B5F63;max-width:34ch;line-height:1.4}
  .badge{font-family:"JetBrains Mono",monospace;font-size:17px;letter-spacing:.1em;
    text-transform:uppercase;color:#C6304B;border:2px solid #C6304B;border-radius:100px;
    padding:12px 22px;white-space:nowrap}
</style></head>
<body>
  <div class="brand">IN<i>—</i>CRM</div>
  <h1>Порядок в продажах.<br><b>За 30 дней.</b></h1>
  <div class="foot">
    <p>Внедрение и настройка amoCRM под ключ: воронка, интеграции, аналитика, обучение.</p>
    <span class="badge">Партнёр amoCRM</span>
  </div>
</body></html>
